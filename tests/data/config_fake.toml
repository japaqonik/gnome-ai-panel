# Fake ACP agents for the CLI, tests and UAT (one agent per scenario of
# tests/fakes/fake_acp_agent.py). Relative paths are resolved against this directory, so the
# file works from any working directory as long as the repository has a .venv.
#
#   AI_PANEL_CONFIG=tests/data/config_fake.toml make cli ARGS="chat fake-echo 'Cześć'"
#
# Every agent has its own cwd under ~/.cache (crash-once keeps a marker file there).
default_agent = "fake-echo"

[agents.fake-echo]
type = "acp"
command = "../../.venv/bin/python"
args = ["../fakes/fake_acp_agent.py", "--scenario", "echo"]
cwd = "~/.cache/gnome-ai-panel-fake/echo"
startup_timeout_s = 10

