[project]
name = "gnome-ai-panel"
version = "0.1.0"
description = "Side chat panel for GNOME talking to ACP agents and the Anthropic API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded: ruff 0.17 would reformat Python snippets inside the spec/docs.
extend-exclude = ["app/ui/vendor", ".run", "dist", ".pipeline", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gui: needs a display (Xvfb) and GTK/WebKit",
]
